<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Zaproszenie na Ślub</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a241e;
            font-family: 'Lato', sans-serif;
        }

        /* Ekran startowy wymuszony przez politykę prywatności iOS/Android */
        #ekran-startowy {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #25332a 0%, #1a241e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: #fdfaf5;
            text-align: center;
        }

        #ekran-startowy h2 {
            font-family: 'Playfair Display', serif;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        #przycisk-start {
            padding: 15px 40px;
            font-size: 18px;
            background-color: #b8915e;
            color: #fdfaf5;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Kontener panoramy - szerszy niż ekran, przesuwany skryptem */
        #kontener-panoramy {
            position: absolute;
            top: 0;
            left: -100%; /* Margines na przesunięcie w lewo/prawo */
            width: 300%; 
            height: 100%;
            background: url('zaproszenie.jpg') no-repeat center center;
            background-size: cover;
            will-change: transform;
            transition: transform 0.1s ease-out;
        }
    </style>
</head>
<body>

    <div id="ekran-startowy">
        <h2>Asia & Sam</h2>
        <button id="przycisk-start">Otwórz / Open</button>
    </div>

    <div id="kontener-panoramy"></div>

    <script>
        const przycisk = document.getElementById('przycisk-start');
        const ekranStartowy = document.getElementById('ekran-startowy');
        const panorama = document.getElementById('kontener-panoramy');

        przycisk.addEventListener('click', () => {
            // Weryfikacja i żądanie uprawnień dla systemów iOS 13+
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', obslugaRuchu);
                            ukryjEkranStartowy();
                        } else {
                            alert('Do pełnego działania zaproszenia wymagany jest dostęp do żyroskopu.');
                            ukryjEkranStartowy(); // Uruchomienie bez żyroskopu (manualne przesunięcie nie jest tu wdrożone)
                        }
                    })
                    .catch(console.error);
            } else {
                // Dla urządzeń Android lub starszych wersji iOS
                window.addEventListener('deviceorientation', obslugaRuchu);
                ukryjEkranStartowy();
            }
        });

        function ukryjEkranStartowy() {
            ekranStartowy.style.display = 'none';
        }

        function obslugaRuchu(event) {
            // Parametr gamma odpowiada za pochylenie telefonu na boki (od -90 do 90)
            let obrotBoczny = event.gamma; 

            // Ograniczenie maksymalnego wychylenia, by obraz nie uciekł za daleko
            if (obrotBoczny > 60) obrotBoczny = 60;
            if (obrotBoczny < -60) obrotBoczny = -60;

            // Przeliczenie kąta na przesunięcie procentowe w osi X
            // Mnożnik 33 określa czułość ruchu kamery
            let przesuniecieX = (obrotBoczny / 60) * 52; 

            // Zastosowanie transformacji CSS3 dla maksymalnej płynności (wykorzystanie GPU)
            panorama.style.transform = `translateX(${przesuniecieX}%)`;
        }
    </script>
</body>
</html>
