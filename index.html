<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Zaproszenie na Ślub</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a241e;
            font-family: 'Lato', sans-serif;
        }

        /* Ekran startowy - wymagany przez politykę prywatności iOS/Android */
        #ekran-startowy {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #25332a 0%, #1a241e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: #fdfaf5;
            text-align: center;
        }

        #ekran-startowy h2 {
            font-family: 'Playfair Display', serif;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        #przycisk-start {
            padding: 15px 40px;
            font-size: 18px;
            background-color: #b8915e;
            color: #fdfaf5;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Kontener panoramy - teraz ma 100% ekranu, ruszamy tylko tłem */
        #kontener-panoramy {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('zaproszenie.png') no-repeat center center;
            background-size: auto 100%; /* Blokuje wysokość do ekranu, szerokość skaluje się proporcjonalnie */
            transition: background-position 0.1s ease-out; /* Wygładza drżenie rąk */
        }
    </style>
</head>
<body>

    <div id="ekran-startowy">
        <h2>Zaproszenie / Invitation</h2>
        <button id="przycisk-start">Otwórz / Open</button>
    </div>

    <div id="kontener-panoramy"></div>

    <script>
        const przycisk = document.getElementById('przycisk-start');
        const ekranStartowy = document.getElementById('ekran-startowy');
        const panorama = document.getElementById('kontener-panoramy');

        przycisk.addEventListener('click', () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', obslugaRuchu);
                            ukryjEkranStartowy();
                        } else {
                            alert('Do pełnego działania zaproszenia wymagany jest dostęp do żyroskopu.');
                            ukryjEkranStartowy();
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientation', obslugaRuchu);
                ukryjEkranStartowy();
            }
        });

        function ukryjEkranStartowy() {
            ekranStartowy.style.display = 'none';
        }

        function obslugaRuchu(event) {
            let obrotBoczny = event.gamma; // Wychylenie na boki od -90 do 90

            // Maksymalny komfortowy kąt obrotu dłoni (np. 30 stopni w lewo lub w prawo)
            const komfortowyKat = 50; 
            
            if (obrotBoczny > komfortowyKat) obrotBoczny = komfortowyKat;
            if (obrotBoczny < -komfortowyKat) obrotBoczny = -komfortowyKat;

            // Mapowanie kąta (-30 do 30) na zakres procentowy pozycji tła (0% do 100%)
            // Przechylenie w lewo (ujemna gamma) dąży do 0% (lewa krawędź grafiki)
            let pozycjaProcentowa = ((obrotBoczny + komfortowyKat) / (komfortowyKat * 2)) * 100;

            // Zmiana pozycji osi X tła
            panorama.style.backgroundPositionX = `${pozycjaProcentowa}%`;
        }
    </script>
</body>
</html>
